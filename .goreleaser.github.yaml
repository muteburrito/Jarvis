project_name: jarvis

builds:
  - id: jarvis-desktop
    main: ./cmd/desktop
    binary: jarvis
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    flags:
      - -tags=desktop,production
    ldflags:
      - -s -w -X main.Version={{.Version}} -X go-chatbot/internal/updater.builtinRepo={{.Env.GITHUB_REPOSITORY}}

archives:
  - id: standalone
    name_template: "jarvis_{{.Version}}_{{.Os}}_{{.Arch}}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  draft: false
  replace_existing_draft: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
  groups:
    - title: Features
      regexp: "^feat"
      order: 0
    - title: Fixes
      regexp: "^fix"
      order: 1
    - title: Other
      regexp: ".*"
      order: 999
