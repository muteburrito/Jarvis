name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    # Standard GitHub-hosted runner, free and unlimited for public repositories.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./cmd/server

      - name: Test
        run: go test ./cmd/server ./internal/... ./web

      - name: Vet
        run: go vet ./cmd/server ./internal/... ./web

  desktop:
    name: Desktop build
    # Standard GitHub-hosted runner, free and unlimited for public repositories.
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build desktop app
        run: go build -tags "desktop,production" ./cmd/desktop

  goreleaser:
    name: GoReleaser
    # Standard GitHub-hosted runner, free and unlimited for public repositories.
    runs-on: ubuntu-latest
    needs:
      - build
      - desktop
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --config .goreleaser.github.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: goreleaser-dist
          path: dist/
          retention-days: 1

  windows-installer:
    name: Windows installer
    # Standard GitHub-hosted runner, free and unlimited for public repositories.
    runs-on: windows-latest
    needs: goreleaser
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download GoReleaser dist
        uses: actions/download-artifact@v8
        with:
          name: goreleaser-dist
          path: dist

      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Force -Path dist\installer | Out-Null
          go build -tags "desktop,production" `
            -ldflags "-s -w -X main.Version=${{ github.ref_name }} -X go-chatbot/internal/updater.builtinRepo=${{ github.repository }}" `
            -o packaging\windows\jarvis.exe `
            ./cmd/desktop
          makensis "-DVERSION=$version" packaging\windows\jarvis.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed with exit code $LASTEXITCODE" }
          Move-Item "packaging\windows\jarvis-setup-$version.exe" "dist\installer\jarvis-setup-$version.exe"

      - name: Upload installer to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ github.ref_name }}".TrimStart("v")
          gh release upload "${{ github.ref_name }}" "dist\installer\jarvis-setup-$version.exe" --clobber

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/installer/
